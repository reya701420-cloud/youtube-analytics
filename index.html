<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YouTube Analytics Pro — a secure creator analytics workspace powered by authorized YouTube data.">
  <title>YouTube Analytics Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #080a0f;
      --bg-soft: #0c0f16;
      --surface: #11141c;
      --surface-2: #171b25;
      --surface-3: #1d222e;
      --text: #f4f6fb;
      --text-soft: #c4cad6;
      --muted: #8c96a9;
      --border: rgba(255,255,255,.075);
      --border-strong: rgba(255,255,255,.13);
      --accent: #ff4155;
      --accent-rgb: 255,65,85;
      --violet: #8b5cf6;
      --blue: #38bdf8;
      --green: #2dd4a0;
      --amber: #f7b955;
      --danger: #fb7185;
      --shadow: 0 14px 40px rgba(0,0,0,.22);
      --sidebar: 258px;
    }

    [data-theme="light"] {
      --bg: #f4f6fa;
      --bg-soft: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f8f9fc;
      --surface-3: #eef1f6;
      --text: #151923;
      --text-soft: #3e4655;
      --muted: #6f7889;
      --border: rgba(19,27,43,.085);
      --border-strong: rgba(19,27,43,.15);
      --shadow: 0 12px 34px rgba(32,42,65,.07);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      transition: background .25s ease, color .25s ease;
    }
    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    button, input, select, textarea { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }
    h1,h2,h3,h4 { font-family: "Plus Jakarta Sans", sans-serif; margin: 0; }
    ::selection { background: rgba(var(--accent-rgb),.25); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 20px; }
    :focus-visible { outline: 2px solid rgba(var(--accent-rgb),.75); outline-offset: 2px; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      z-index: 60;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      backdrop-filter: blur(20px);
    }
    .brand {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, var(--accent), #d91f42);
      box-shadow: 0 8px 24px rgba(var(--accent-rgb),.24);
      position: relative;
      overflow: hidden;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 70px;
      background: rgba(255,255,255,.13);
      transform: rotate(35deg);
      left: -40px;
      animation: logoShine 5s ease-in-out infinite;
    }
    @keyframes logoShine { 0%,65%{left:-40px} 85%,100%{left:60px} }
    .brand-name { font-family: "Plus Jakarta Sans"; font-weight: 800; font-size: 15px; letter-spacing: -.35px; line-height: 1.2; }
    .brand-sub { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 1.35px; margin-top: 3px; }
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 18px 12px; }
    .nav-label { padding: 12px 12px 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      margin: 2px 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      transition: .18s ease;
    }
    .nav-item svg { width: 18px; height: 18px; stroke-width: 1.8; flex-shrink: 0; }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active {
      color: var(--text);
      background: rgba(var(--accent-rgb),.105);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -12px;
      width: 3px;
      height: 22px;
      border-radius: 0 4px 4px 0;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(var(--accent-rgb),.45);
    }
    .nav-item.active svg { color: var(--accent); }
    .nav-ai-badge { margin-left: auto; font-size: 9px; padding: 3px 6px; border-radius: 5px; color: #bda7ff; background: rgba(139,92,246,.13); font-weight: 700; }
    .sidebar-bottom { padding: 12px; border-top: 1px solid var(--border); }
    .quota-card { padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
    .quota-line { height: 4px; background: var(--surface-3); border-radius: 5px; overflow: hidden; margin-top: 9px; }
    .quota-line > span { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .5s ease; }
    .sidebar-profile { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; text-align: left; }
    .sidebar-profile:hover { background: var(--surface-2); }
    .avatar { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; background: var(--surface-3); flex-shrink: 0; }

    .main-shell { margin-left: var(--sidebar); min-height: 100vh; }
    .topbar {
      height: 76px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 26px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .topbar-subtitle { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .mobile-menu { display: none !important; }
    .page-content { padding: 24px 26px 42px; max-width: 1720px; margin: 0 auto; }
    .page-enter { animation: pageIn .42s cubic-bezier(.22,1,.36,1); }
    @keyframes pageIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 1px 0 rgba(255,255,255,.015);
    }
    .card-pad { padding: 20px; }
    .card-hover { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .card-hover:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .section-title { font-size: 18px; font-weight: 700; letter-spacing: -.45px; }
    .section-subtitle { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.55; }
    .card-title { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
    .muted { color: var(--muted); }
    .text-soft { color: var(--text-soft); }
    .small { font-size: 12px; }
    .tiny { font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .truncate-1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 13px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .18s ease;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .btn-primary { background: var(--accent); color: white; border-color: transparent; box-shadow: 0 7px 20px rgba(var(--accent-rgb),.18); }
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); color: white; border-color: transparent; transform: translateY(-1px); }
    .btn-dark { background: var(--surface-2); }
    .btn-danger { color: var(--danger); background: rgba(251,113,133,.07); border-color: rgba(251,113,133,.15); }
    .btn-sm { min-height: 32px; padding: 6px 10px; font-size: 11px; border-radius: 8px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: .18s ease;
      flex-shrink: 0;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    .search-button {
      height: 38px;
      width: 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }
    .search-button kbd { margin-left: auto; border: 1px solid var(--border); background: var(--surface-2); border-radius: 5px; padding: 2px 5px; font-size: 9px; }
    .search-button svg { width: 15px; }

    .input, .select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      outline: none;
      transition: border .18s, box-shadow .18s;
    }
    .input:focus, .select:focus { border-color: rgba(var(--accent-rgb),.55); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.08); }
    .input::placeholder { color: var(--muted); }
    .select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position: calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size: 5px 5px,5px 5px; background-repeat: no-repeat; }
    .select-wrap { position: relative; }
    .input-wrap { position: relative; }
    .input-wrap > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--muted); pointer-events: none; }
    .input-wrap > .input { padding-left: 37px; }
    .field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-soft); margin-bottom: 7px; }
    .field-help { color: var(--muted); font-size: 10px; line-height: 1.55; margin-top: 6px; }
    .checkbox { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .35px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .badge svg { width: 11px; height: 11px; }
    .badge-demo { color: var(--amber); background: rgba(247,185,85,.08); border-color: rgba(247,185,85,.16); }
    .badge-live { color: var(--green); background: rgba(45,212,160,.08); border-color: rgba(45,212,160,.16); }
    .badge-info { color: var(--blue); background: rgba(56,189,248,.08); border-color: rgba(56,189,248,.15); }
    .badge-violet { color: #b9a1ff; background: rgba(139,92,246,.1); border-color: rgba(139,92,246,.16); }
    [data-theme="light"] .badge-violet { color: #6d45d9; }
    .trend { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; border-radius: 6px; padding: 3px 6px; }
    .trend svg { width: 11px; height: 11px; }
    .trend-up { color: var(--green); background: rgba(45,212,160,.08); }
    .trend-down { color: var(--danger); background: rgba(251,113,133,.08); }
    .trend-neutral { color: var(--muted); background: var(--surface-2); }

    .connection-notice {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 13px;
      border: 1px solid rgba(56,189,248,.16);
      background: rgba(56,189,248,.055);
      color: var(--text-soft);
      font-size: 11px;
      line-height: 1.5;
    }
    .connection-notice.demo { border-color: rgba(247,185,85,.18); background: rgba(247,185,85,.055); }
    .connection-notice > svg { width: 18px; flex-shrink: 0; color: var(--blue); }
    .connection-notice.demo > svg { color: var(--amber); }
    .connection-notice .notice-actions { margin-left: auto; display: flex; gap: 7px; flex-shrink: 0; }

    .metric-grid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 14px; }
    .metric-card { padding: 17px; min-height: 145px; position: relative; overflow: hidden; }
    .metric-card::after { content: ""; position: absolute; inset: auto -30px -50px auto; width: 100px; height: 100px; border-radius: 50%; background: var(--metric-color,var(--accent)); opacity: .035; filter: blur(3px); }
    .metric-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--metric-color,var(--accent)); background: color-mix(in srgb, var(--metric-color,var(--accent)) 10%, transparent); }
    .metric-icon svg { width: 17px; height: 17px; }
    .metric-value { font-family: "Plus Jakarta Sans"; font-size: 25px; font-weight: 700; letter-spacing: -.8px; margin-top: 15px; line-height: 1.1; }
    .metric-label { color: var(--muted); font-size: 11px; margin-top: 7px; }
    .metric-foot { margin-top: 11px; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; }
    .period-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .period-card { padding: 16px 17px; display: flex; align-items: center; gap: 12px; min-height: 96px; }
    .period-value { font-family: "Plus Jakarta Sans"; font-size: 20px; font-weight: 700; letter-spacing: -.5px; margin-top: 5px; }
    .sparkline { width: 92px; height: 36px; margin-left: auto; overflow: visible; }
    .sparkline polyline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 300; animation: drawLine 1.1s ease both; }
    @keyframes drawLine { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }

    .dashboard-main-grid { display: grid; grid-template-columns: minmax(0,1.85fr) minmax(280px,.75fr); gap: 16px; }
    .dashboard-bottom-grid { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(300px,.65fr); gap: 16px; }
    .two-col { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .three-col { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; }
    .four-col { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .chart-wrap { position: relative; height: 300px; width: 100%; }
    .chart-wrap.sm { height: 240px; }
    .chart-wrap.xs { height: 190px; }
    .chart-wrap canvas { max-width: 100%; }
    .segmented { display: inline-flex; align-items: center; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
    .segmented button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 6px 10px; font-size: 10px; font-weight: 600; cursor: pointer; }
    .segmented button:hover { color: var(--text); }
    .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.12); }

    .realtime-status { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); position: relative; }
    .pulse-dot::after { content: ""; position: absolute; inset: -4px; border: 1px solid var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%{transform:scale(.6);opacity:.8} 80%,100%{transform:scale(1.5);opacity:0} }
    .unavailable-box { padding: 14px; border: 1px dashed var(--border-strong); border-radius: 11px; background: var(--surface-2); }
    .unavailable-box svg { color: var(--muted); width: 18px; }

    .video-list-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .video-list-item:last-child { border-bottom: 0; }
    .thumb { width: 112px; aspect-ratio: 16/9; border-radius: 9px; object-fit: cover; background: var(--surface-3); flex-shrink: 0; }
    .thumb-sm { width: 82px; }
    .thumb-xs { width: 58px; border-radius: 7px; }
    .video-title-button { border: 0; padding: 0; background: transparent; text-align: left; cursor: pointer; color: var(--text); font-weight: 600; font-size: 12px; line-height: 1.45; }
    .video-title-button:hover { color: var(--accent); }

    .table-wrap { overflow-x: auto; border-radius: 13px; border: 1px solid var(--border); }
    .data-table { width: 100%; border-collapse: collapse; min-width: 1080px; background: var(--surface); }
    .data-table th { text-align: left; padding: 12px 13px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 700; letter-spacing: .55px; text-transform: uppercase; white-space: nowrap; }
    .data-table td { padding: 12px 13px; border-bottom: 1px solid var(--border); color: var(--text-soft); font-size: 11px; vertical-align: middle; white-space: nowrap; }
    .data-table tbody tr { transition: background .15s; }
    .data-table tbody tr:hover { background: var(--surface-2); }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table .num { color: var(--text); font-weight: 600; }
    .table-video { display: flex; align-items: center; gap: 11px; min-width: 280px; max-width: 340px; white-space: normal; }
    .table-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 2px 0; color: var(--muted); font-size: 11px; }
    .pagination { display: flex; gap: 5px; }

    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; padding: 14px; margin-bottom: 14px; }
    .toolbar .input-wrap { min-width: 220px; flex: 1; }
    .toolbar .select { width: auto; min-width: 140px; }

    .channel-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .channel-card { padding: 20px; }
    .channel-head { display: flex; align-items: center; gap: 14px; }
    .channel-avatar { width: 62px; height: 62px; border-radius: 17px; object-fit: cover; background: var(--surface-3); }
    .channel-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 15px 0; margin: 17px 0 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .channel-stat-value { font-family: "Plus Jakarta Sans"; font-size: 16px; font-weight: 700; }
    .channel-stat-label { color: var(--muted); font-size: 9px; margin-top: 4px; }

    .hero-video { position: relative; min-height: 310px; border-radius: 18px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
    .hero-video > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .48; }
    .hero-video::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,rgba(6,8,13,.97) 0%,rgba(6,8,13,.75) 48%,rgba(6,8,13,.18) 100%); }
    [data-theme="light"] .hero-video::after { background: linear-gradient(90deg,rgba(12,15,23,.96) 0%,rgba(12,15,23,.78) 52%,rgba(12,15,23,.18) 100%); }
    .hero-video-content { position: relative; z-index: 2; padding: 30px; max-width: 650px; color: #f7f8fb; }
    .hero-video-title { font-size: 26px; line-height: 1.25; letter-spacing: -.7px; margin: 15px 0 10px; }

    .loading-bar { position: fixed; z-index: 200; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); opacity: 0; transition: width .3s,opacity .3s; box-shadow: 0 0 12px var(--accent); }

<body>
  <div id="loadingBar" class="loading-bar"></div>

  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="play" style="width:18px;fill:currentColor"></i></div>

    </div>

    <div class="sidebar-bottom">

  <div class="main-shell">

        </button>
        <div class="topbar-channel">
          <select id="channelSwitcher" class="select" style="width:185px;min-height:38px" aria-label="Active channel"></select>
        </div>

  <div id="modalRoot"></div>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script>
    /* ---------- Utilities ---------- */
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => [...root.querySelectorAll(s)];
    const DAY = 86400000;
    const esc = value => String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
    const num = value => value === null || value === undefined || value === "" || Number.isNaN(Number(value)) ? null : Number(value);
    const compact = value => value === null || value === undefined || Number.isNaN(Number(value)) ? "—" : new Intl.NumberFormat("en", {notation:"compact", maximumFractionDigits:1}).format(Number(value));
    const full = value => value === null || value === undefined ? "—" : new Intl.NumberFormat("en-US").format(Number(value));
    const money = value => value === null || value === undefined ? "—" : "$" + compact(value);
    const pct = value => value === null || value === undefined ? "—" : `${Number(value).toFixed(1)}%`;
    const hours = value => value === null || value === undefined ? "—" : `${compact(value)} h`;
    const duration = seconds => {
      if (seconds === null || seconds === undefined) return "—";
      const s = Math.max(0, Math.round(Number(seconds)));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      return h ? `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}` : `${m}:${String(r).padStart(2,"0")}`;
    };
    const dateISO = date => {
      const d = date instanceof Date ? date : new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };
    const dateFmt = (value, options = {month:"short",day:"numeric",year:"numeric"}) => {
      if (!value) return "—";
      return new Intl.DateTimeFormat("en-US", options).format(new Date(String(value).length === 10 ? value + "T12:00:00" : value));
    };
    const timeAgo = value => {
      if (!value) return "Never";
      const seconds = Math.floor((Date.now() - new Date(value).getTime()) / 1000);
      if (seconds < 60) return "Just now";
      if (seconds < 3600) return `${Math.floor(seconds/60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds/3600)}h ago`;
      return `${Math.floor(seconds/86400)}d ago`;
    };
    const growth = (current, previous) => previous && current !== null && previous !== null ? ((current - previous) / Math.abs(previous)) * 100 : null;
    const sum = (rows, key) => rows.reduce((total, row) => total + (Number(row[key]) || 0), 0);
    const safeJSON = (value, fallback = null) => { try { return JSON.parse(value); } catch { return fallback; } };
    const icon = (name, cls = "") => `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ""}></i>`;
    const modeBadge = () => state.mode === "demo"
      ? `<span class="badge badge-demo">${icon("flask-conical")} SAMPLE DATA</span>`
      : `<span class="badge badge-live">${icon("shield-check")} AUTHORIZED DATA</span>`;
    const formatByType = (value, type) => {
      if (type === "currency") return money(value);
      if (type === "hours") return hours(value);
      if (type === "percent") return pct(value);
      if (type === "integer") return full(Math.round(value));
      if (type === "duration") return duration(value);
      return compact(value);
    };
    const countHtml = (value, type = "compact") => value === null || value === undefined
      ? `<span>—</span>`
      : `<span data-count="${Number(value)}" data-format="${type}">0</span>`;
    const trendHtml = (value, label = "") => {
      if (value === null || value === undefined || !Number.isFinite(value)) return `<span class="trend trend-neutral">${label || "No comparison"}</span>`;
      const up = value >= 0;
      return `<span class="trend ${up ? "trend-up" : "trend-down"}">${icon(up ? "trending-up" : "trending-down")}${Math.abs(value).toFixed(1)}%</span>${label ? `<span>${esc(label)}</span>` : ""}`;
    };
    const parseISODuration = iso => {
      const match = String(iso || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      return match ? (Number(match[1] || 0) * 3600) + (Number(match[2] || 0) * 60) + Number(match[3] || 0) : 0;
    };
    const mulberry32 = seed => () => {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const downloadBlob = (content, name, type = "text/plain") => {
      const blob = content instanceof Blob ? content : new Blob([content], {type});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    const copyText = async text => {
      try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
      catch { toast("Clipboard access is unavailable", "error"); }
    };

    /* ---------- Application state ---------- */
    const menu = [
      {id:"dashboard", label:"Dashboard", icon:"layout-dashboard", sub:"Your channel at a glance"},
      {id:"channels", label:"My Channels", icon:"radio-tower", sub:"Manage authorized YouTube channels"},
      {id:"videos", label:"Video Analytics", icon:"video", sub:"Performance for every uploaded video"},
      {id:"best", label:"Best Performing Videos", icon:"trophy", sub:"Rankings, leaders and viral content"},
      {id:"shorts", label:"Shorts Analytics", icon:"smartphone", sub:"Short-form performance and rankings"},
      {id:"growth", label:"Channel Growth", icon:"chart-no-axes-combined", sub:"Views, watch time and subscriber trends"},
      {id:"audience", label:"Audience Analytics", icon:"users", sub:"Demographics and viewer geography"},
      {id:"comparison", label:"Video Comparison", icon:"columns-3", sub:"Compare videos across core metrics"},
      {id:"ai", label:"AI Analysis", icon:"sparkles", sub:"Data-grounded recommendations and reports"},
      {id:"reports", label:"Reports", icon:"file-chart-column", sub:"Build and export analytics reports"},
      {id:"settings", label:"Settings", icon:"settings-2", sub:"Connection, privacy and preferences"}
    ];
    const defaults = {
      theme: "dark",
      range: 28,
      clientId: "",
      aiProxy: "",
      maxVideos: 100,
      requestMonetary: true,
      reduceMotion: false,
      accent: "red"
    };
    const storedSettings = safeJSON(localStorage.getItem("yap_settings"), {}) || {};
    const state = {
      page: "dashboard",
      mode: "demo",
      channels: [],
      activeChannelId: null,
      videos: [],
      analytics: {daily:[], coreAvailable:false, revenueAvailable:false, audience:null},
      accessToken: null,
      grantedScopes: "",
      settings: {...defaults, ...storedSettings},
      lastSync: null,
      syncing: false,
      noticeDismissed: false,
      dashboardMetric: "views",
      videoSort: "views",
      videoFilter: "all",
      videoSearch: "",
      videoPage: 1,
      videoPerPage: 10,
      bestMetric: "viral",
      bestCount: 10,
      compareIds: [],
      quotaUsed: 0,
      analyticsQueries: 0,
      aiInsights: [],
      aiNarrative: "",
      aiLoading: false,
      aiLastRun: null,
      chat: [],
      report: {type:"monthly", start:null, end:null},
      charts: {}
    };
    const accents = {
      red: {hex:"#ff4155", rgb:"255,65,85"},
      violet: {hex:"#8b5cf6", rgb:"139,92,246"},
      blue: {hex:"#0ea5e9", rgb:"14,165,233"},
      green: {hex:"#10b981", rgb:"16,185,129"}
    };

    function saveSettings() {
      localStorage.setItem("yap_settings", JSON.stringify(state.settings));
    }

    /* ---------- Derived analytics ---------- */
    const currentChannel = () => state.channels.find(c => c.id === state.activeChannelId) || state.channels[0] || null;
    const daily = () => state.analytics.daily || [];
    const rangeDaily = (days = Number(state.settings.range)) => daily().slice(-days);
    const sumLast = (days, key) => daily().length ? sum(daily().slice(-days), key) : null;
    const previousSum = (days, key) => daily().length > days ? sum(daily().slice(-(days*2),-days),key) : null;
    const videoAge = video => Math.max(1, Math.ceil((Date.now() - new Date(video.publishedAt).getTime()) / DAY));
    const isShort = video => !!video.isShort || Number(video.duration) <= 60;
    const metricValue = (video, metric) => {
      switch(metric) {
        case "viral": return video.views / videoAge(video);
        case "trending": return video.recentViews ?? null;
        case "views": return video.views;
        case "likes": return video.likes;
        case "comments": return video.comments;
        case "retention": return video.retention;
        case "subscribersGained": return video.subscribersGained;
        case "watchHours": return video.watchHours;
        case "low": return video.views;
        case "last24h": return state.mode === "demo" ? video.last24h : null;
        default: return video.views;
      }
    };
    function rankVideos(metric = "views", videos = state.videos) {
      const eligible = videos.filter(v => metric !== "low" || videoAge(v) >= 14);
      return [...eligible].sort((a,b) => {
        const av = metricValue(a,metric), bv = metricValue(b,metric);
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        return metric === "low" ? av - bv : bv - av;
      });
    }
    function sparkline(values, color = "var(--accent)") {
      if (!values || values.length < 2) return "";
      const data = values.slice(-30), min = Math.min(...data), max = Math.max(...data), spread = max-min || 1;
      const points = data.map((v,i)=>`${(i/(data.length-1)*116).toFixed(1)},${(33-(v-min)/spread*28).toFixed(1)}`).join(" ");
      return `<svg class="sparkline" viewBox="0 0 116 36" aria-hidden="true"><polyline points="${points}" style="stroke:${color}"></polyline></svg>`;
    }

              <div class="flex items-center gap-3 mb-3"><div class="metric-icon" style="--metric-color:var(--green)">${icon("shield-check")}</div><h2 class="card-title">Secure by design</h2></div>
              ${[
                ["key-round","Read-only OAuth 2.0","Only authorized YouTube read scopes are requested."],
                ["memory-stick","Memory-only access tokens","OAuth tokens are never written to localStorage."],
                ["server-cog","No client secrets","Client IDs are public identifiers. Never add a client secret or unrestricted API key."],
                ["list-checks","Quota-aware loading","Configurable upload limits and batched video requests reduce API usage."]
              ].map(([ic,t,s])=>`<div class="security-item">${icon(ic)}<div><div class="small font-semibold">${t}</div><div class="tiny muted mt-1 leading-relaxed">${s}</div></div></div>`).join("")}
            </article>
            <article class="card card-pad">
              <h2 class="card-title">Connection scopes</h2>
              <div class="mt-3 space-y-2 tiny muted leading-relaxed">
                <div class="flex justify-between gap-3"><span>YouTube Data API v3</span><span class="text-[var(--green)]">Read-only</span></div>
                <div class="flex justify-between gap-3"><span>YouTube Analytics API</span><span class="text-[var(--green)]">Read-only</span></div>
                <div class="flex justify-between gap-3"><span>Monetary reports</span><span>${state.settings.requestMonetary?"Optional":"Disabled"}</span></div>
              </div>
              <button class="btn w-full mt-4" data-page="settings">${icon("settings-2")} Connection settings</button>
            </article>
          </div>
        </div>`;
    }

    /* ---------- Video analytics ---------- */
    function filteredVideos() {
      const query = state.videoSearch.trim().toLowerCase();
      const filtered = state.videos.filter(v => {
        if (state.videoFilter === "shorts" && !isShort(v)) return false;
        if (state.videoFilter === "long" && isShort(v)) return false;
        return !query || v.title.toLowerCase().includes(query) || (v.tags || []).join(" ").toLowerCase().includes(query);
      });
      return filtered.sort((a,b) => {
        if (state.videoSort === "date") return new Date(b.publishedAt) - new Date(a.publishedAt);
        if (state.videoSort === "title") return a.title.localeCompare(b.title);
        const key = state.videoSort;
        return (num(b[key]) ?? -Infinity) - (num(a[key]) ?? -Infinity);
      });
    }
    function videoResultsTemplate() {
      const videos = filteredVideos();
      const pages = Math.max(1, Math.ceil(videos.length / state.videoPerPage));
      state.videoPage = clamp(state.videoPage,1,pages);
      const start = (state.videoPage-1)*state.videoPerPage;
      const visible = videos.slice(start,start+state.videoPerPage);
      if (!visible.length) return `<div class="card empty-state min-h-[300px]"><div><div class="empty-icon">${icon("search-x")}</div><h2>No matching videos</h2><p>Try another search term or content filter.</p></div></div>`;
      return `<div class="table-wrap"><table class="data-table">
        <thead><tr><th style="width:35px">Compare</th><th>Video</th><th>Upload date</th><th>Views</th><th>Likes</th><th>Comments</th><th>Watch time</th><th>Avg. duration</th><th>Retention</th><th>Subs gained</th><th>Revenue</th></tr></thead>
        <tbody>${visible.map(v=>`<tr>
          <td><input class="checkbox" type="checkbox" data-compare-id="${esc(v.id)}" ${state.compareIds.includes(v.id)?"checked":""} aria-label="Compare ${esc(v.title)}"></td>
          <td><div class="table-video"><img class="thumb thumb-sm" src="${esc(v.thumbnail)}" alt=""><div class="min-w-0"><button class="video-title-button clamp-2" data-action="video-detail" data-id="${esc(v.id)}">${esc(v.title)}</button><div class="tiny muted mt-1">${isShort(v)?`<span class="text-[var(--accent)]">SHORT</span> · `:""}${duration(v.duration)}</div></div></div></td>
          <td>${dateFmt(v.publishedAt,{month:"short",day:"numeric",year:"2-digit"})}</td>
          <td class="num">${compact(v.views)}</td><td>${compact(v.likes)}</td><td>${compact(v.comments)}</td>
          <td>${hours(v.watchHours)}</td><td>${duration(v.avgViewDuration)}</td><td>${pct(v.retention)}</td>
          <td class="num">${compact(v.subscribersGained)}</td><td>${money(v.revenue)}</td>
        </tr>`).join("")}</tbody></table></div>
        <div class="table-footer"><span>Showing ${start+1}–${Math.min(start+state.videoPerPage,videos.length)} of ${videos.length} videos${currentChannel()?.videoCount>state.videos.length?` · ${full(currentChannel().videoCount)} total on channel`:""}</span>
        <div class="pagination"><button class="btn btn-sm" data-action="video-page" data-page-num="${state.videoPage-1}" ${state.videoPage===1?"disabled":""}>${icon("chevron-left")}</button>
        <span class="btn btn-sm pointer-events-none">${state.videoPage} / ${pages}</span>
        <button class="btn btn-sm" data-action="video-page" data-page-num="${state.videoPage+1}" ${state.videoPage===pages?"disabled":""}>${icon("chevron-right")}</button></div></div>`;
    }
    function videosPage() {
      const gate = dataGate(); if (gate) return gate;
      return `${pageHead("Video Analytics", "Lifetime Data API totals with available per-video Analytics API metrics.", `<button class="btn" data-action="export-videos">${icon("download")} Export CSV</button><button class="btn btn-primary" data-page="comparison">${icon("columns-3")} Compare selected</button>`)}
        <div class="card toolbar">
          <div class="input-wrap">${icon("search")}<input id="videoSearch" class="input" placeholder="Search title or topic..." value="${esc(state.videoSearch)}"></div>
          <select id="videoFilter" class="select"><option value="all" ${state.videoFilter==="all"?"selected":""}>All content</option><option value="long" ${state.videoFilter==="long"?"selected":""}>Long-form</option><option value="shorts" ${state.videoFilter==="shorts"?"selected":""}>Shorts</option></select>
          <select id="videoSort" class="select">
            ${[["views","Sort: Views"],["likes","Sort: Likes"],["comments","Sort: Comments"],["watchHours","Sort: Watch time"],["retention","Sort: Retention"],["subscribersGained","Sort: Subscribers"],["revenue","Sort: Revenue"],["date","Sort: Upload date"],["title","Sort: Title"]].map(([v,l])=>`<option value="${v}" ${state.videoSort===v?"selected":""}>${l}</option>`).join("")}
          </select>
        </div>
        <div class="mb-3 flex items-center gap-2 tiny muted">${icon("info")} Watch time, retention and subscriber metrics use available lifetime YouTube Analytics reports. “—” means the API did not provide that field.</div>
        <div id="videoResults">${videoResultsTemplate()}</div>`;
    }

    /* ---------- Best performing ---------- */
    const rankingLabels = {viral:"Viral score",trending:"Recent views",views:"Views",likes:"Likes",comments:"Comments",retention:"Retention",subscribersGained:"Subscribers",low:"Views",last24h:"24h views"};
    function bestPage() {
      const gate = dataGate(); if (gate) return gate;
      const viral = rankVideos("viral")[0];
      const leaders = [
        ["views","Most viewed","eye","#8b5cf6"],["likes","Most liked","thumbs-up","#ff4155"],
        ["comments","Most discussed","message-circle","#38bdf8"],["subscribersGained","Subscriber driver","user-plus","#2dd4a0"],
        ["retention","Best retention","timer","#f7b955"]
      ];
      const ranked = rankVideos(state.bestMetric).slice(0,state.bestCount);
      const max = ranked.length ? Number(metricValue(ranked[0],state.bestMetric)) || 1 : 1;
      const top24 = state.mode === "demo" ? rankVideos("last24h")[0] : null;
      return `${pageHead("Best Performing Videos", "Viral, trending, engagement, retention and low-performance rankings.", `
        <div class="segmented">${[10,20].map(n=>`<button data-action="best-count" data-value="${n}" class="${state.bestCount===n?"active":""}">Top ${n}</button>`).join("")}</div>`)}
        <section class="hero-video mb-[16px]">
          <img src="${esc(viral.thumbnail)}" alt="${esc(viral.title)}">
          <div class="hero-video-content"><span class="badge" style="color:#ffd2d8;background:rgba(255,65,85,.18);border-color:rgba(255,100,115,.25)">${icon("flame")} MOST VIRAL BY VIEWS PER DAY</span>
          <h2 class="hero-video-title">${esc(viral.title)}</h2><p class="small" style="color:#b6bfce">Published ${dateFmt(viral.publishedAt)} · ${compact(metricValue(viral,"viral"))} views per day since upload</p>
          <div class="hero-stats"><div class="hero-stat"><strong>${compact(viral.views)}</strong><span>Views</span></div><div class="hero-stat"><strong>${compact(viral.likes)}</strong><span>Likes</span></div><div class="hero-stat"><strong>${pct(viral.retention)}</strong><span>Retention</span></div><div class="hero-stat"><strong>${compact(viral.subscribersGained)}</strong><span>Subs gained</span></div></div>
          <button class="btn mt-6" data-action="video-detail" data-id="${esc(viral.id)}">${icon("chart-no-axes-combined")} View video details</button></div>
        </section>
        <section class="three-col mb-[16px]">
          ${leaders.map(([metric,label,ic,color])=>{const v=rankVideos(metric)[0];return `<article class="card card-hover winner-card"><div class="winner-icon" style="color:${color};background:color-mix(in srgb,${color} 10%,transparent)">${icon(ic)}</div><img class="thumb thumb-xs" src="${esc(v.thumbnail)}" alt=""><div class="min-w-0 flex-1"><div class="tiny muted font-semibold">${label.toUpperCase()}</div><button class="video-title-button truncate-1 w-full mt-1" data-action="video-detail" data-id="${esc(v.id)}">${esc(v.title)}</button></div><div class="small font-bold">${metric==="retention"?pct(metricValue(v,metric)):compact(metricValue(v,metric))}</div></article>`}).join("")}
          <article class="card winner-card"><div class="winner-icon" style="color:var(--blue);background:rgba(56,189,248,.08)">${icon("zap")}</div>
            ${top24?`<img class="thumb thumb-xs" src="${esc(top24.thumbnail)}" alt=""><div class="min-w-0 flex-1"><div class="tiny muted font-semibold">LAST 24 HOURS · SAMPLE</div><div class="small truncate-1 font-semibold mt-1">${esc(top24.title)}</div></div><div class="small font-bold">${compact(top24.last24h)}</div>`:`<div><div class="tiny muted font-semibold">LAST 24 HOURS</div><div class="small font-semibold mt-1">Not provided by public API</div><div class="tiny muted mt-1">No estimate shown</div></div>`}
          </article>
        </section>
        <section class="card card-pad">
          <div class="section-head"><div><h2 class="card-title">Video ranking system</h2><p class="section-subtitle">Trending uses available 28-day per-video views. Viral uses lifetime views per day since upload.</p></div>
            <div class="segmented" style="flex-wrap:wrap">${[["viral","Viral"],["trending","Trending"],["views","Most viewed"],["likes","Most liked"],["retention","Best retention"],["low","Low performing"]].map(([id,l])=>`<button data-action="best-metric" data-value="${id}" class="${state.bestMetric===id?"active":""}">${l}</button>`).join("")}</div>
          </div>
          ${ranked.map((v,i)=>{const value=metricValue(v,state.bestMetric);const width=state.bestMetric==="low"?Math.max(8,(Number(value)||0)/max*100):(Number(value)||0)/max*100;return `<div class="rank-row">
            <div class="rank-number ${i<3?"top":""}">${i+1}</div>
            <div class="flex items-center gap-3 min-w-0"><img class="thumb thumb-xs" src="${esc(v.thumbnail)}" alt=""><div class="min-w-0"><button class="video-title-button truncate-1 w-full" data-action="video-detail" data-id="${esc(v.id)}">${esc(v.title)}</button><div class="tiny muted mt-1">${dateFmt(v.publishedAt,{month:"short",day:"numeric",year:"2-digit"})}</div></div></div>
            <div class="rank-progress"><span style="width:${clamp(width,2,100)}%"></span></div>
            <div class="text-right"><div class="small font-bold">${state.bestMetric==="retention"?pct(value):compact(value)}</div><div class="tiny muted mt-1">${rankingLabels[state.bestMetric]}</div></div>
          </div>`}).join("")}
        </section>`;
    }

    /* ---------- Shorts ---------- */
    function shortsPage() {
      const gate = dataGate(); if (gate) return gate;
      const shorts = state.videos.filter(isShort);
      if (!shorts.length) return `${pageHead("Shorts Analytics","Short-form video analysis")}${emptyState("No Shorts detected","The YouTube Data API has no explicit Shorts flag. This workspace conservatively identifies videos with a duration of 60 seconds or less.")}`;
      const ranked = rankVideos("views",shorts);
      const views = sum(shorts,"views"), likes = sum(shorts,"likes"), comments = sum(shorts,"comments");
      const engagedAvailable = shorts.some(v=>v.engagedViews !== null && v.engagedViews !== undefined);
      const avgDuration = shorts.reduce((n,v)=>n+(v.avgViewDuration||0),0)/shorts.length;
      return `${pageHead("Shorts Analytics", "Short-form views, engagement, watch behavior and subscriber contribution.", `<button class="btn" data-action="export-shorts">${icon("download")} Export Shorts</button>`)}
        <div class="connection-notice mb-[16px]">${icon("info")}<span>Shorts are detected using duration ≤ 60 seconds. YouTube Data API v3 does not expose an explicit Shorts classification; newer longer Shorts may require manual verification.</span></div>
        <section class="metric-grid mb-[16px]">
          ${metricCard("Total Shorts",shorts.length,"integer","smartphone","#ff4155","Detected from loaded uploads")}
          ${metricCard("Shorts views",views,"compact","eye","#8b5cf6","Lifetime across loaded Shorts")}
          ${metricCard("Engaged views",engagedAvailable?sum(shorts,"engagedViews"):null,"compact","scan-eye","#38bdf8",engagedAvailable?"Available Analytics metric":"Not supplied by API")}
          ${metricCard("Likes & comments",likes+comments,"compact","messages-square","#2dd4a0",`${pct(views?(likes+comments)/views*100:null)} engagement rate`)}
          ${metricCard("Average view duration",avgDuration,"duration","timer","#f7b955","Across loaded Shorts")}
          ${metricCard("Subscribers gained",sum(shorts,"subscribersGained"),"compact","user-plus","#fb7185","Attributed by Analytics API")}
        </section>
        <section class="section-head mt-2"><div><h2 class="section-title">Most viral Shorts</h2><p class="section-subtitle">Ranked by lifetime views</p></div></section>
        <section class="shorts-grid mb-[18px]">${ranked.slice(0,5).map((v,i)=>`<article class="card card-hover short-card">
          <div class="short-thumb-wrap"><img src="${esc(v.thumbnail)}" alt="${esc(v.title)}"><span class="short-duration">${duration(v.duration)}</span><span class="badge badge-demo" style="position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:white;border-color:rgba(255,255,255,.15)">#${i+1}</span></div>
          <div class="short-body"><button class="video-title-button clamp-2 min-h-[35px]" data-action="video-detail" data-id="${esc(v.id)}">${esc(v.title)}</button>
          <div class="flex items-center justify-between mt-3 tiny muted"><span>${icon("eye")} ${compact(v.views)}</span><span>${icon("thumbs-up")} ${compact(v.likes)}</span><span>${icon("message-circle")} ${compact(v.comments)}</span></div>
          <div class="mt-3 pt-3 border-t border-[var(--border)] flex justify-between tiny"><span class="muted">Retention</span><strong>${pct(v.retention)}</strong></div></div>
        </article>`).join("")}</section>
        <section class="card card-pad"><div class="section-head"><div><h2 class="card-title">Shorts performance ranking</h2><p class="section-subtitle">Complete loaded Shorts leaderboard</p></div></div>
        ${ranked.map((v,i)=>`<div class="rank-row"><div class="rank-number ${i<3?"top":""}">${i+1}</div><div class="flex items-center gap-3 min-w-0"><img class="thumb thumb-xs" src="${esc(v.thumbnail)}" alt=""><div class="min-w-0"><button class="video-title-button truncate-1 w-full" data-action="video-detail" data-id="${esc(v.id)}">${esc(v.title)}</button><div class="tiny muted mt-1">${compact(v.subscribersGained)} subscribers gained</div></div></div><div class="rank-progress"><span style="width:${clamp(v.views/ranked[0].views*100,2,100)}%"></span></div><div class="text-right small font-bold">${compact(v.views)}<div class="tiny muted font-normal mt-1">views</div></div></div>`).join("")}</section>`;
    }

    /* ---------- Growth ---------- */
    function aggregateDaily(period) {
      const groups = {};
      daily().forEach(row => {
        const date = new Date(row.date+"T12:00:00");
        let key;
        if (period === "month") key = row.date.slice(0,7);
        else {
          const monday = new Date(date);
          const offset = (date.getDay()+6)%7;
          monday.setDate(date.getDate()-offset);
          key = dateISO(monday);
        }
        if (!groups[key]) groups[key] = {date:key,views:0,estimatedMinutesWatched:0,subscribersGained:0,subscribersLost:0};
        ["views","estimatedMinutesWatched","subscribersGained","subscribersLost"].forEach(k=>groups[key][k]+=Number(row[k])||0);
      });
      return Object.values(groups).sort((a,b)=>a.date.localeCompare(b.date));
    }
    function uploadImpacts() {
      const map = new Map(daily().map((r,i)=>[r.date,i]));
      return state.videos.map(v=>{
        const index = map.get(dateISO(v.publishedAt));
        if (index === undefined || index < 7 || index+7 >= daily().length) return null;
        const before = sum(daily().slice(index-7,index),"views");
        const after = sum(daily().slice(index,index+7),"views");
        return before ? {video:v,lift:growth(after,before),after,before} : null;
      }).filter(Boolean).sort((a,b)=>Math.abs(b.lift)-Math.abs(a.lift)).slice(0,8);
    }
    function monthComparison() {
      const d = daily();
      if (!d.length) return null;
      const latest = new Date(d[d.length-1].date+"T12:00:00");
      const day = latest.getDate();
      const currentPrefix = dateISO(latest).slice(0,7);
      const prev = new Date(latest.getFullYear(),latest.getMonth()-1,1);
      const previousPrefix = dateISO(prev).slice(0,7);
      const current = d.filter(r=>r.date.startsWith(currentPrefix));
      const previous = d.filter(r=>r.date.startsWith(previousPrefix) && Number(r.date.slice(8,10))<=day);
      const stats = rows => ({views:sum(rows,"views"),watch:sum(rows,"estimatedMinutesWatched")/60,subs:sum(rows,"subscribersGained")-sum(rows,"subscribersLost")});
      return {current:stats(current),previous:stats(previous),currentLabel:dateFmt(latest,{month:"long"}),previousLabel:dateFmt(prev,{month:"long"}),day};
    }
    function growthPage() {
      const gate = dataGate(false); if (gate) return gate;
      if (!daily().length) return `${pageHead("Channel Growth","Daily, weekly and monthly growth analysis")}${unavailable("Growth data unavailable","YouTube Analytics read-only permission is required for daily growth reports.","chart-no-axes-combined")}`;
      const comparison = monthComparison(), impacts = uploadImpacts();
      const range = rangeDaily();
      const currentViews = sum(range,"views"), prevViews = previousSum(Number(state.settings.range),"views");
      const currentSubs = sum(range,"subscribersGained")-sum(range,"subscribersLost");
      const prevRange = daily().slice(-(Number(state.settings.range)*2),-Number(state.settings.range));
      const prevSubs = sum(prevRange,"subscribersGained")-sum(prevRange,"subscribersLost");
      return `${pageHead("Channel Growth", "Daily, weekly and monthly views, subscribers, watch time and upload impact.", `
        <div class="segmented">${[7,28,90,365].map(n=>`<button data-action="set-range" data-value="${n}" class="${Number(state.settings.range)===n?"active":""}">${n}D</button>`).join("")}</div>
        <button class="btn" data-page="reports">${icon("file-down")} Growth report</button>`)}
        <section class="four-col mb-[16px]">
          <article class="card card-pad"><div class="tiny muted">VIEWS · ${state.settings.range} DAYS</div><div class="metric-value">${countHtml(currentViews)}</div><div class="metric-foot">${trendHtml(growth(currentViews,prevViews),"vs previous period")}</div></article>
          <article class="card card-pad"><div class="tiny muted">NET SUBSCRIBERS</div><div class="metric-value">${countHtml(currentSubs)}</div><div class="metric-foot">${trendHtml(growth(currentSubs,prevSubs),"vs previous period")}</div></article>
          <article class="card card-pad"><div class="tiny muted">WATCH HOURS</div><div class="metric-value">${countHtml(sum(range,"estimatedMinutesWatched")/60,"hours")}</div><div class="metric-foot">Selected period</div></article>
          <article class="card card-pad"><div class="tiny muted">AVG. DAILY VIEWS</div><div class="metric-value">${countHtml(range.length?currentViews/range.length:null)}</div><div class="metric-foot">${range.length} reported days</div></article>
        </section>
        <section class="dashboard-main-grid mb-[16px]">
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Daily views growth</h2><p class="section-subtitle">Daily channel views with upload markers in the table below</p></div></div><div class="chart-wrap"><canvas id="dailyGrowthChart"></canvas></div></article>
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Subscriber growth</h2><p class="section-subtitle">Gained minus lost subscribers</p></div></div><div class="chart-wrap"><canvas id="subscriberGrowthChart"></canvas></div></article>
        </section>
        <section class="two-col mb-[16px]">
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Weekly views</h2><p class="section-subtitle">Aggregated by week beginning Monday</p></div></div><div class="chart-wrap sm"><canvas id="weeklyGrowthChart"></canvas></div></article>
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Monthly views & watch time</h2><p class="section-subtitle">Long-term channel trajectory</p></div></div><div class="chart-wrap sm"><canvas id="monthlyGrowthChart"></canvas></div></article>
        </section>
        <section class="two-col">
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">This month vs previous month</h2><p class="section-subtitle">Fair month-to-date comparison through day ${comparison.day}</p></div><span class="badge badge-info">${comparison.currentLabel}</span></div>
            <div class="growth-compare">${[["Views","views","compact"],["Watch hours","watch","hours"],["Net subscribers","subs","compact"]].map(([label,key,type])=>`<div class="compare-stat"><span class="tiny muted">${label}</span><strong>${formatByType(comparison.current[key],type)}</strong><div class="flex items-center gap-1 flex-wrap">${trendHtml(growth(comparison.current[key],comparison.previous[key]))}<span class="tiny muted">vs ${formatByType(comparison.previous[key],type)}</span></div></div>`).join("")}</div>
            <div class="chart-wrap xs mt-5"><canvas id="monthCompareChart"></canvas></div>
          </article>
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Upload impact</h2><p class="section-subtitle">Channel views in 7 days after upload vs 7 days before</p></div></div>
            ${impacts.length?`<div class="chart-wrap xs mb-3"><canvas id="uploadImpactChart"></canvas></div>${impacts.slice(0,4).map(x=>`<div class="flex items-center gap-3 py-2 border-b border-[var(--border)] last:border-0"><img class="thumb thumb-xs" src="${esc(x.video.thumbnail)}" alt=""><div class="min-w-0 flex-1"><div class="tiny truncate-1 font-medium">${esc(x.video.title)}</div><div class="tiny muted mt-1">${dateFmt(x.video.publishedAt,{month:"short",day:"numeric"})}</div></div>${trendHtml(x.lift)}</div>`).join("")}`:unavailable("Not enough upload-window data","Upload impact requires seven reported days before and after an upload.","upload")}
          </article>
        </section>`;
    }

    /* ---------- Audience ---------- */
    function audiencePage() {
      const gate = dataGate(false); if (gate) return gate;
      const a = state.analytics.audience;
      if (!a) return `${pageHead("Audience Analytics","Demographics and viewer geography")}${unavailable("Audience reports unavailable","Reconnect with YouTube Analytics read-only permission. Demographic reports may also be unavailable for small audiences.","users")}`;
      const countries = a.countries || [], cities = a.cities || [], ages = a.ages || [], gender = a.gender || [];
      const maxCountry = countries.length ? countries[0].views : 1;
      return `${pageHead("Audience Analytics", "Available age, gender, country and city reports from YouTube Analytics.", `<span class="badge badge-info">API AVAILABILITY APPLIES</span>`)}
        <section class="two-col mb-[16px]">
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Age distribution</h2><p class="section-subtitle">Viewer percentage by age group</p></div></div>
            ${ages.length?`<div class="chart-wrap sm"><canvas id="ageChart"></canvas></div>`:unavailable("Age data unavailable","YouTube may withhold demographic data when the audience is too small.")}

    /* ---------- Data-grounded smart analysis ---------- */
    function topicScores() {
      const stop = new Set(["this","that","with","your","from","have","what","when","only","just","like","make","every","into","youtube","video","videos","shorts","creator","best","most","full","complete","should","after","before"]);
      const scores = {};
      state.videos.forEach(v=>{
        const words = v.tags?.length ? v.tags : v.title.toLowerCase().replace(/[^a-z0-9\s]/g,"").split(/\s+/);
        [...new Set(words.map(w=>w.toLowerCase()).filter(w=>w.length>3&&!stop.has(w)))].forEach(word=>{
          if (!scores[word]) scores[word] = {topic:word,views:0,count:0};
          scores[word].views += Number(v.views)||0; scores[word].count++;
        });
      });
      return Object.values(scores).sort((a,b)=>(b.views/b.count)-(a.views/a.count));
    }
    function getLocalInsights() {
      if (!state.videos.length) return [];
      const byRecent = rankVideos("trending"), byViews = rankVideos("views"), byRetention = rankVideos("retention").filter(v=>v.views>1000);
      const strong = byRecent[0].recentViews !== null ? byRecent[0] : rankVideos("viral")[0];
      const mature = state.videos.filter(v=>videoAge(v)>=14);
      const sortedViews = mature.map(v=>v.views).sort((a,b)=>a-b);
      const median = sortedViews.length?sortedViews[Math.floor(sortedViews.length/2)]:0;
      const weak = [...mature].filter(v=>v.views<median*.6).sort((a,b)=>a.views-b.views)[0] || rankVideos("low")[0];
      const topics = topicScores();
      const titleCandidate = [...state.videos].filter(v=>v.title.length>70 || (v.views<median*.75 && v.title.length<28)).sort((a,b)=>a.views-b.views)[0];
      const d30 = daily().slice(-30), prev30 = daily().slice(-60,-30);
      const views30 = sum(d30,"views"), viewGrowth = growth(views30,sum(prev30,"views"));
      const retention = byRetention[0];
      const uploadCount30 = state.videos.filter(v=>videoAge(v)<=30).length;
      return [
        {type:"success",icon:"trending-up",color:"#2dd4a0",title:"Strongest current performer",body:`“${strong.title}” leads ${strong.recentViews!==null?"recent 28-day views":"views per day since upload"} with ${compact(strong.recentViews??metricValue(strong,"viral"))}. Consider a follow-up while its topic has momentum.`},
        {type:"warning",icon:"triangle-alert",color:"#f7b955",title:"Video needing attention",body:`“${weak.title}” is below the mature-video median with ${compact(weak.views)} views. Review its search intent, opening 30 seconds and packaging before reusing the format.`},
        {type:"topic",icon:"lightbulb",color:"#8b5cf6",title:"Recommended next topic",body:topics.length?`Your strongest weighted topic is “${topics[0].topic}”, generating ${compact(topics[0].views)} views across ${topics[0].count} related upload${topics[0].count===1?"":"s"}. Build a new angle rather than repeating the same title.`:"Add more uploads to unlock topic recommendations."},
        {type:"retention",icon:"timer",color:"#38bdf8",title:"Retention pattern to reuse",body:`“${retention.title}” has the strongest available audience retention at ${pct(retention.retention)}. Analyze its pacing and structure; retention alone does not prove causation.`},
        {type:"packaging",icon:"image",color:"#fb7185",title:"Title and thumbnail review",body:titleCandidate?`Review packaging for “${titleCandidate.title}”. Its title is ${titleCandidate.title.length} characters and lifetime views are ${compact(titleCandidate.views)}. Impressions CTR is not exposed by the API, so validate thumbnail changes in YouTube Studio.`:`Impressions CTR is not available through the connected APIs. Use YouTube Studio to validate thumbnail and title changes; no CTR has been inferred here.`},
        {type:"growth",icon:"chart-no-axes-combined",color:viewGrowth!==null&&viewGrowth>=0?"#2dd4a0":"#fb7185",title:"30-day growth recommendation",body:d30.length?`Views are ${viewGrowth===null?"without a complete comparison":`${Math.abs(viewGrowth).toFixed(1)}% ${viewGrowth>=0?"up":"down"} versus the previous 30 days`}. You published ${uploadCount30} loaded video${uploadCount30===1?"":"s"} in 30 days; maintain a sustainable cadence and prioritize the strongest topic.`:"Daily Analytics data is required for a 30-day growth recommendation."}
      ];
    }
    function buildAIContext() {
      const c = currentChannel();
      return {
        dataMode:state.mode, channel:c?.name, rangeDays:30,
        totals:{subscribers:c?.subscribers,views:c?.views,videos:c?.videoCount},
        last30Days:{views:sumLast(30,"views"),watchHours:daily().length?sum(daily().slice(-30),"estimatedMinutesWatched")/60:null,subscribersGained:sumLast(30,"subscribersGained"),subscribersLost:sumLast(30,"subscribersLost")},
        videos:state.videos.slice(0,100).map(v=>({title:v.title,publishedAt:v.publishedAt,views:v.views,likes:v.likes,comments:v.comments,watchHours:v.watchHours,averageViewDuration:v.avgViewDuration,retention:v.retention,subscribersGained:v.subscribersGained,recentViews:v.recentViews})),
        limitations:["No minute-level real-time data","No inferred impressions CTR","Unavailable fields are null"]
      };
    }
    function localAnswer(question) {
      const q = question.toLowerCase(), insights = getLocalInsights();
      if (q.includes("weak") || q.includes("low") || q.includes("worst") || q.includes("कमजोर")) return insights[1].body;
      if (q.includes("topic") || q.includes("next") || q.includes("अगला")) return insights[2].body;
      if (q.includes("title") || q.includes("thumbnail")) return insights[4].body;
      if (q.includes("retention")) return insights[3].body;
      if (q.includes("grow") || q.includes("growth") || q.includes("report") || q.includes("30")) return insights[5].body;
      if (q.includes("best") || q.includes("perform") || q.includes("viral")) return insights[0].body;
      return `Based on the loaded data: ${insights[0].body}\n\nNext step: ${insights[2].body}\n\nAsk about weak videos, retention, titles, growth or your 30-day report for a focused answer.`;
    }
    async function callAIProxy(prompt) {
      if (!state.settings.aiProxy) return null;
      const response = await fetch(state.settings.aiProxy,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,context:buildAIContext()})});
      if (!response.ok) throw new Error(`Secure AI proxy returned ${response.status}`);
      const data = await response.json();
      return data.text || data.output || data.candidates?.[0]?.content?.parts?.map(p=>p.text).join("\n") || null;
    }
    async function runAIAnalysis() {
      if (!state.videos.length) return toast("Load video analytics first","error");
      state.aiLoading = true; renderPage();
      try {
        state.aiInsights = getLocalInsights();
        state.aiNarrative = await callAIProxy("Act as a senior YouTube channel strategist. Use only the supplied analytics. Identify strong and weak videos, topic opportunities, packaging reviews, growth actions and a concise 30-day report. Explicitly acknowledge unavailable metrics; never invent values.") || "";
        state.aiLastRun = new Date().toISOString();
        toast(state.settings.aiProxy?"Secure AI analysis complete":"Smart analysis refreshed");
      } catch(error) {
        state.aiNarrative = "";
        toast(`${error.message}. Local data-grounded insights remain available.`,"error");
      } finally { state.aiLoading=false; renderPage(); }
    }
    function aiPage() {
      const gate = dataGate(); if (gate) return gate;
      const insights = state.aiInsights.length?state.aiInsights:getLocalInsights();
      const d30 = daily().slice(-30), previous = daily().slice(-60,-30);

      return `${pageHead("Smart AI Analysis", "Recommendations grounded only in loaded analytics, with an optional secure Gemini/OpenAI proxy.", `
        <button class="btn btn-primary" data-action="run-ai" ${state.aiLoading?"disabled":""}>${icon("sparkles")} ${state.aiLoading?"Analyzing...":"Run analysis"}</button>`)}
        <section class="card ai-hero mb-[16px]">
          <div class="flex items-start gap-4 relative z-10"><div class="ai-symbol">${icon("sparkles")}</div><div class="flex-1"><div class="flex items-center gap-2 flex-wrap"><h2 class="section-title">Creator intelligence briefing</h2><span class="badge badge-violet">${state.settings.aiProxy?"SECURE AI PROXY":"LOCAL INSIGHT ENGINE"}</span></div>
          <p class="section-subtitle max-w-[760px]">Every recommendation below is derived from your loaded channel and video metrics. Unavailable data is excluded rather than simulated. Configure a server-side AI proxy in Settings for generative analysis without exposing an API key.</p>
          <div class="flex items-center gap-3 mt-4 tiny muted"><span>${icon("database")} ${state.videos.length} videos analyzed</span><span>${icon("calendar")} ${daily().length} daily rows</span><span>${state.aiLastRun?"Updated "+timeAgo(state.aiLastRun):"Ready to analyze"}</span></div></div></div>
        </section>
        ${state.aiNarrative?`<section class="card card-pad mb-[16px]"><div class="section-head"><div><h2 class="card-title">Secure AI narrative</h2><p class="section-subtitle">Generated by your configured server-side AI endpoint</p></div><button class="btn btn-sm" data-action="copy-ai">${icon("copy")} Copy</button></div><div class="small text-soft leading-7 whitespace-pre-wrap">${esc(state.aiNarrative)}</div></section>`:""}
        <section class="three-col mb-[16px]">${insights.map(item=>`<article class="card card-hover insight-card" style="--insight-color:${item.color}"><div class="insight-icon mb-4">${icon(item.icon)}</div><h3 class="card-title">${esc(item.title)}</h3><p class="small muted mt-3 leading-relaxed">${esc(item.body)}</p></article>`).join("")}</section>
        <section class="dashboard-main-grid">
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">30-day performance report</h2><p class="section-subtitle">Computed from available daily channel reports</p></div><button class="btn btn-sm" data-action="copy-report">${icon("copy")} Copy report</button></div>
            <div class="four-col mb-5"><div class="compare-stat"><span class="tiny muted">VIEWS</span><strong>${compact(report.views)}</strong>${trendHtml(report.change)}</div><div class="compare-stat"><span class="tiny muted">WATCH HOURS</span><strong>${compact(report.watch)}</strong></div><div class="compare-stat"><span class="tiny muted">NET SUBSCRIBERS</span><strong>${compact(report.subs)}</strong></div><div class="compare-stat"><span class="tiny muted">TOP VIDEO</span><strong class="text-[13px] leading-snug">${esc(rankVideos("views")[0].title.slice(0,28))}...</strong></div></div>
            <div id="aiReportText" class="small text-soft leading-7 whitespace-pre-wrap">${esc(build30DayReport())}</div>
            <button class="btn mt-5" data-page="reports">${icon("file-chart-column")} Build downloadable report</button>
          </article>
          <article class="card card-pad"><div class="section-head"><div><h2 class="card-title">Ask your analytics</h2><p class="section-subtitle">Questions are answered from loaded data</p></div>${icon("message-square-text")}</div>
            <div class="chat-box" id="chatBox">${state.chat.length?state.chat.map(m=>`<div class="chat-message ${m.role}"><div class="chat-bubble">${esc(m.text)}</div></div>`).join(""):`<div class="chat-message"><div class="chat-bubble">Ask which video is strongest, what to publish next, which titles need work, or for a 30-day growth summary.</div></div>`}</div>
            <div class="flex flex-wrap gap-2 my-3">${["What should I publish next?","Which video is weak?","Summarize 30-day growth"].map(q=>`<button class="btn btn-sm" data-action="ask-preset" data-question="${esc(q)}">${q}</button>`).join("")}</div>
            <form id="aiChatForm" class="flex gap-2"><input id="aiQuestion" class="input" placeholder="Ask about your channel..." required><button class="btn btn-primary" type="submit" aria-label="Send">${icon("send")}</button></form>
          </article>
        </section>`;
    }
    function build30DayReport() {
      const d = daily().slice(-30), p = daily().slice(-60,-30);
      if (!d.length) return "Daily YouTube Analytics data is unavailable. Connect with Analytics read-only permission to generate a 30-day report.";
      const top = rankVideos("trending")[0], topics = topicScores();
      return `Performance summary\n• ${full(sum(d,"views"))} views across ${d.length} reported days.\n• ${compact(sum(d,"estimatedMinutesWatched")/60)} watch hours.\n• ${full(sum(d,"subscribersGained")-sum(d,"subscribersLost"))} net subscribers.\n• Views changed ${growth(sum(d,"views"),sum(p,"views"))?.toFixed(1) ?? "—"}% versus the previous 30 days.\n\nContent leader\n${top.title} leads recent performance with ${compact(top.recentViews)} views in the available 28-day report.\n\nRecommended focus\n${topics.length?`Develop a new angle on ${topics[0].topic}, the strongest view-weighted topic in the loaded catalog.`:"Continue collecting topic-level performance data."}\n\nMeasurement note\nThis report uses only loaded YouTube data. It does not infer real-time views, impressions CTR, or unavailable demographic metrics.`;
    }

    /* ---------- Reports ---------- */

        state.report.start=start; state.report.end=end;
      }

      return `${pageHead("Reports", "Build daily, weekly, monthly and custom reports from authorized analytics.", `

          ${[...rows].reverse().map(r=>`<tr><td class="num">${dateFmt(r.date)}</td><td>${full(r.views)}</td><td>${(r.estimatedMinutesWatched/60).toFixed(1)}</td><td>${full(r.subscribersGained)}</td><td>${full(r.subscribersLost)}</td><td class="num">${full(r.subscribersGained-r.subscribersLost)}</td><td>${state.analytics.revenueAvailable?money(r.estimatedRevenue):"—"}</td></tr>`).join("")}

    /* ---------- Settings ---------- */
    function settingsPage() {
